# Development stack: Postgres, Redis, Django (ASGI), Celery worker + beat, Vite dev server.
# Usage: docker compose up --build   then open http://localhost:5173
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: schoolbus
      POSTGRES_PASSWORD: schoolbus
      POSTGRES_DB: schoolbus
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolbus"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      args: { INSTALL_DEV: "true" }
    env_file: ./backend/.env.docker
    volumes:
      - ./backend:/app
      - media:/app/media
    ports: ["127.0.0.1:${BACKEND_PORT:-8001}:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: sh -c "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 config.asgi:application"

  worker:
    build:
      context: ./backend
      args: { INSTALL_DEV: "true" }
    env_file: ./backend/.env.docker
    volumes:
      - ./backend:/app
    depends_on: [backend]
    command: celery -A config worker -l info --concurrency=2

  beat:
    build:
      context: ./backend
      args: { INSTALL_DEV: "true" }
    env_file: ./backend/.env.docker
    volumes:
      - ./backend:/app
    depends_on: [backend]
    command: celery -A config beat -l info

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: /api
      VITE_DEV_PROXY_TARGET: http://backend:8000
    ports: ["5173:5173"]
    depends_on: [backend]
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"

volumes:
  pgdata:
  media:
  frontend_node_modules:
